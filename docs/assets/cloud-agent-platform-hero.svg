    <text x="95" y="27" text-anchor="middle" fill="#ccfbf1" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">OPEN-SOURCE MVP</text>
    <text x="0" y="122" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="65" font-weight="750">Cloud Agent Platform</text>
    <text x="0" y="174" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="27">Customer evidence → executable plan → bounded agents.</text>
  </g>
  <g transform="translate(82 334)" font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect width="238" height="118" rx="18" fill="#0f1f36" stroke="#5eead4" stroke-width="2"/>
      <text x="24" y="45" fill="#5eead4" font-size="18" font-weight="700">01 / INPUT</text>
      <text x="24" y="79" fill="#f8fafc" font-size="22">Customer need</text>
      <text x="24" y="105" fill="#94a3b8" font-size="16">or Git repository</text>
    </g>
    <path d="M258 59H318" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M308 49L320 59L308 69" fill="none" stroke="#60a5fa" stroke-width="4"/>
    <g transform="translate(338)">
      <rect width="258" height="118" rx="18" fill="#0f1f36" stroke="#60a5fa" stroke-width="2"/>
      <text x="24" y="45" fill="#93c5fd" font-size="18" font-weight="700">02 / DISCOVER</text>
      <text x="24" y="79" fill="#f8fafc" font-size="22">Probe + structure</text>
      <text x="24" y="105" fill="#94a3b8" font-size="16">facts, owners, constraints</text>
    </g>
    <path d="M616 59H676" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M666 49L678 59L666 69" fill="none" stroke="#60a5fa" stroke-width="4"/>
    <g transform="translate(696)">
      <rect width="238" height="118" rx="18" fill="#0f1f36" stroke="#818cf8" stroke-width="2"/>
      <text x="24" y="45" fill="#a5b4fc" font-size="18" font-weight="700">03 / OUTPUT</text>
      <text x="24" y="79" fill="#f8fafc" font-size="22">Technical plan</text>
      <text x="24" y="105" fill="#94a3b8" font-size="16">executable and auditable</text>
    </g>
  </g>
  <g transform="translate(82 532)" font-family="Segoe UI, Arial, sans-serif" font-size="17">
