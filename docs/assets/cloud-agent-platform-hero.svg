<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Agent Platform</title>
  <desc id="desc">FDE discovery and bounded, auditable AI agent workflows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10233f"/>
      <stop offset="1" stop-color="#162b4c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1080" cy="85" r="220" fill="#2563eb" opacity="0.12"/>
  <circle cx="180" cy="590" r="250" fill="#14b8a6" opacity="0.10"/>
  <g opacity="0.12" stroke="#93c5fd">
