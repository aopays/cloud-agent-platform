name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements.lock -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m pytest -m security -q
      - run: python -m compileall -q src tests scripts

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build application image
        run: docker build --tag cloud-agent-platform:ci .
      - name: Compose application without contacting OpenAI
        run: >-
          docker run --rm
          --env LLM_PROVIDER=demo
          --env SANDBOX_BACKEND=local
          cloud-agent-platform:ci
          python -c "import src.main; print(src.main.app.title)"
      - name: Build sandbox image
        run: docker build --file sandbox/Dockerfile --tag cloud-agent-sandbox:ci .
      - name: Verify sandbox user and network isolation
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1
          cloud-agent-sandbox:ci python -c
          "import os,socket; assert os.getuid()==65532; s=socket.socket();
          s.settimeout(1); assert s.connect_ex(('1.1.1.1',53)) != 0"
